<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="currentColor" color="#1b2a41" role="img" aria-labelledby="rb-mark-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="rb-mark-title">Riverbend Bible Church mark: a river bending toward the horizon inside a circle</title>
  <!-- Original mark for Riverbend Bible Church (fictional demo).
       A ring holds a field below the horizon; a river runs out of the
       distance, bends once, and opens toward the viewer, breaking the ring.
       Single color: uses currentColor so it follows the section's ink. -->
  <defs>
    <mask id="rb-river" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <path fill="#000" d="M60.5 55.5 C54 60 37 63 36 70 C35 77 44 84 40 101 L66 101 C66 88 50 80 49 73 C48.5 67 60 61 64.5 55.5 Z"/>
    </mask>
  </defs>
  <g mask="url(#rb-river)">
    <path fill-rule="evenodd" d="M50 3a47 47 0 1 1 0 94a47 47 0 1 1 0-94Zm0 7a40 40 0 1 0 0 80a40 40 0 1 0 0-80Z"/>
    <path d="M8.9 55.5 H91.1 A41.5 41.5 0 0 1 8.9 55.5 Z"/>
  </g>
</svg>
