<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="currentColor" color="#13213a" role="img" aria-labelledby="cbf-mark-title">
  <title id="cbf-mark-title">Cornerstone Bible Fellowship mark: a squared letter C laid in dressed stone, resting on a larger cornerstone</title>
  <!-- Original mark for Cornerstone Bible Fellowship (fictional demo).
       A squared "C" laid in four dressed stones with mortar joints. The block
       at the lower-left corner is the cornerstone: larger than the rest and
       set first, so every course lines up to it (Ephesians 2:20).
       Single color: uses currentColor so it follows the section's ink.
       Keep the joints; do not outline, rotate, or stretch the mark. -->
  <rect x="4" y="4" width="29.5" height="15" rx="1"/>
  <rect x="36" y="4" width="24" height="15" rx="1"/>
  <rect x="4" y="21.5" width="15" height="12" rx="1"/>
  <rect x="4" y="36" width="24" height="24" rx="1"/>
  <rect x="30.5" y="45" width="29.5" height="15" rx="1"/>
</svg>
