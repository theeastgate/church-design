<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="currentColor" color="#161616" role="img" aria-labelledby="ss-mark-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ss-mark-title">Sunnyside Community Church mark: a rising sun above a smile</title>
  <!-- Original mark for Sunnyside Community Church (fictional demo).
       A half sun rises over a wide smiling arc, with five short rays.
       The smile is the horizon: the sun comes up on the sunny side.
       Single color: uses currentColor so it follows the section's ink. -->
  <path fill="currentColor" stroke="none" d="M27 60 A23 23 0 0 1 73 60 Z"/>
  <path stroke-width="9" stroke-linecap="round" d="M13 68 Q50 98 87 68"/>
  <g stroke-width="7.5" stroke-linecap="round">
    <path d="M50 18 V27"/>
    <path d="M23.2 30.9 L29.6 37.3"/>
    <path d="M76.8 30.9 L70.4 37.3"/>
    <path d="M9 55 H17"/>
    <path d="M91 55 H83"/>
  </g>
</svg>
